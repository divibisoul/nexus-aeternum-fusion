name: Nexus Soul Bridge Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/core/**'
      - 'src/integration/**'
      - 'src/soul-mesh/**'
      - 'src/components/NexusInput.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/nexus-soul-bridge-build.yml'

permissions:
  contents: read

concurrency:
  group: nexus-soul-bridge
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify lockfile determinism
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/package-lock.before.json"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! cmp -s package-lock.json "$RUNNER_TEMP/package-lock.before.json"; then
            echo 'LOCKFILE_DRIFT_DETECTED'
            git --no-pager diff -- package-lock.json
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: test -s dist/index.html
