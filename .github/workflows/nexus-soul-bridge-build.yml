name: Nexus Soul Bridge Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/nexus-soul-bridge-build.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexus-soul-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify lockfile is synchronized
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify build artifact
        run: test -s dist/index.html
