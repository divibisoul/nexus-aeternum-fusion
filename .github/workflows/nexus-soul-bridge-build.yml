name: Nexus Soul Bridge Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/core/**'
      - 'src/integration/**'
      - 'src/soul-mesh/**'
      - 'src/components/NexusInput.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/nexus-soul-bridge-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -s dist/index.html
