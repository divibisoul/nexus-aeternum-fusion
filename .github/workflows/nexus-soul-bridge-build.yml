name: Nexus Soul Bridge Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/core/**'
      - 'src/integration/**'
      - 'src/soul-mesh/**'
      - 'src/mesh/**'
      - 'api/**'
      - 'src/components/NexusInput.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/nexus-soul-bridge-build.yml'

permissions:
  contents: read

concurrency:
  group: nexus-soul-bridge-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Sync npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Preserve synchronized lockfile candidate for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n03-package-lock-candidate
          path: package-lock.json
          if-no-files-found: warn
      # Historical automatic main push is retained below for provenance but disabled.
      # Changes must be reviewed and merged through a pull request.
      - name: Commit synchronized lockfile (legacy; disabled)
        if: ${{ false }}
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "chore(N03): synchronize npm lockfile [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - run: npm ci
      - run: npm run build
      - run: test -s dist/index.html
