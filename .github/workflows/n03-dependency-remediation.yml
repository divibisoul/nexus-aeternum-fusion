name: N03 Dependency Remediation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/n03-dependency-remediation-2026-09-27

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Security gate
        run: npm audit --audit-level=high
      - name: Synchronize Bun lockfile
        run: |
          bun install
          chmod 0644 bun.lockb
      - name: Verify frozen Bun lockfile
        run: bun install --frozen-lockfile
      - name: Install and validate runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Pair fusion test
        run: npm run test:pair-fusion
      - name: Persist dependency locks
        run: |
          set -euo pipefail
          chmod 0644 bun.lockb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json bun.lockb
          if git diff --cached --quiet; then
            echo "dependency lockfiles already synchronized"
            exit 0
          fi
          git commit -m "fix(N03): persist audited dependency lockfiles"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
