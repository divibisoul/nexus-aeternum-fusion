name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile is synchronized
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck Mesh adapter
        run: npx tsc -p tsconfig.mesh.json --noEmit
      - name: Build web runtime
        run: npm run build
