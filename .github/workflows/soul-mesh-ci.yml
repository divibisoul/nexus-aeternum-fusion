name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile is synchronized
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck Mesh adapter
        run: npx tsc -p tsconfig.mesh.json --noEmit
      - name: Pair fusion tests
        run: npm run test:pair-fusion
      - name: Web3.Storage unit tests
        run: bun test lib/storage/web3-storage.test.ts
      - name: Build web runtime
        run: npm run build
