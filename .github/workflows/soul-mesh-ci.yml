name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependency graph for verification
        run: bun install --no-save
      - name: npm ci lockfile integrity
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck Mesh adapter
        run: bun x tsc -p tsconfig.mesh.json --noEmit
      - name: Provider adapter boundary tests
        run: bun test src/mesh/WhisperAdapter.test.ts src/mesh/KokoroAdapter.test.ts src/mesh/N03AudioCapabilityRegistry.test.ts
      - name: Soul Mesh listener smoke
        run: npm run mesh:listener:check
      - name: Build web runtime
        run: bun run build
