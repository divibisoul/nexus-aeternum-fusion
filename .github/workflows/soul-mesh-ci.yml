name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "chore(N03): synchronize npm lockfile [skip ci]"
          git push
      - run: npm ci
      - name: Typecheck Mesh adapter
        run: npx tsc -p tsconfig.mesh.json --noEmit
      - name: Build web runtime
        run: npm run build
