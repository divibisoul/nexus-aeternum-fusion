name: N03 validation diagnostics
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: '22'
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n03-first-step"
          {
            date -u
            uname -a
            cat /etc/os-release
            node --version
            npm --version
            df -hT
            free -h
            printf '%s\n' "${RUNNER_NAME:-}" "${RUNNER_OS:-}" "${RUNNER_ARCH:-}" "${GITHUB_RUN_ID:-}" "${GITHUB_SHA:-}"
          } 2>&1 | tee "$RUNNER_TEMP/n03-first-step/runner.log"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify toolchain
        run: node --version && npm --version && bun --version
      - name: Capture deterministic npm ci evidence
        shell: bash
        run: node scripts/diagnostics.mjs -- npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Pair fusion tests
        run: npm run test:pair-fusion
      - name: Emergency diagnostics
        if: failure()
        run: node scripts/diagnostics.mjs
      - name: Capture GitHub job logs
        if: failure()
        run: node scripts/capture-ci-logs.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n03-diagnostics-${{ github.run_id }}
          path: .diagnostics/
          if-no-files-found: error
          retention-days: 30
      - name: Upload captured job logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-job-logs-${{ github.run_id }}
          path: soul-job-logs-*.json
          if-no-files-found: error
          retention-days: 30
