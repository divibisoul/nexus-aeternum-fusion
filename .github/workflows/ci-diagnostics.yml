name: CI diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  npm-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture npm resolution and audit output
        run: |
          mkdir -p ci-diagnostics
          set +e
          npm --version > ci-diagnostics/npm-install.log 2>&1
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund >> ci-diagnostics/npm-install.log 2>&1
          echo "INSTALL_EXIT_CODE=$?" >> ci-diagnostics/npm-install.log
          npm audit --audit-level=high >> ci-diagnostics/npm-install.log 2>&1
          echo "AUDIT_EXIT_CODE=$?" >> ci-diagnostics/npm-install.log
      - name: Persist diagnostic log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics/npm-install.log
          git commit -m "chore(n03): persist dependency diagnostic log [skip ci]" || true
          git push origin "HEAD:${{ github.head_ref }}" || true
