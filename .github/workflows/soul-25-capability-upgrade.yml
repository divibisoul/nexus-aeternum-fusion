name: SOUL 25 Capability Upgrade - N03

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize npm lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): synchronize npm lockfile"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: Validate 25-repository augmentation contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('integrations/soul-25-augmentation.json'))
          assert d['external_provider_count'] == 16
          assert len(d['external_providers']) == 16
          assert d['soul_peer_count'] == 9
          assert len(d['soul_peers']) == 9
          assert d['native_authority'] == 'preserved'
          for p in d['external_providers']:
              assert p['id'] and p['capabilities']
              assert p['access'] == 'N07 canonical federation'
              assert p['structural_state'] == 'REAL'
              assert p['runtime_state'] == 'PROJECTED'
              assert p['requires_adapter'] is True
          print('SOUL-25 AUGMENTATION CONTRACT: PASS')
          PY
