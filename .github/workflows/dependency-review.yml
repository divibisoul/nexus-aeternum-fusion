name: Dependency Security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify lockfile matches package manifest
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production and development dependency graph
        run: npm audit --audit-level=high
