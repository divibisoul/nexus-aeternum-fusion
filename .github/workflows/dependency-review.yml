name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate immutable dependency graph
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate dependency audit evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > dependency-audit.json
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n03-dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 30
