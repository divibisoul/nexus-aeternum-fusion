name: Refresh audit lockfile
on:
  push:
    branches: [audit/2026-09-01-hardening]
    paths: [package.json, .github/workflows/refresh-audit-lockfile.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Verify manifest and lock consistency
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(n03): synchronize lockfile with hardened dependencies [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
