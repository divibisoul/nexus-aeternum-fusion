name: Refresh audit lockfile
on:
  push:
    branches: [audit/2026-09-01-hardening]
    paths: [package.json]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(n03): refresh lockfile after dependency hardening [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
