name: N03 Security Lock Remediation
# Executes real Bun audit remediation; no advisory is ignored.

on:
  push:
    branches:
      - feat/soul-integration-boundary-2026-10-02
    paths:
      - package.json
      - bun.lockb
      - .github/workflows/n03-security-lock-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply published non-vulnerable fixes
        run: bun audit fix
      - name: Verify reproducible lock
        run: bun install --frozen-lockfile --dry-run
      - name: Re-audit
        run: bun audit --audit-level=high
      - name: Commit only Bun-managed dependency changes
        run: |
          if git diff --quiet -- package.json bun.lockb bun.lock; then
            echo "No dependency changes produced."
            exit 0
          fi
          git diff --name-only -- package.json bun.lockb bun.lock
          if git diff --name-only -- package.json bun.lockb bun.lock | grep -vE '^(package.json|bun.lockb|bun.lock)$'; then
            echo "Unexpected file modified by Bun audit remediation."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lockb bun.lock 2>/dev/null || true
          git commit -m "chore(deps): remediate N03 audit vulnerabilities"
          git push
