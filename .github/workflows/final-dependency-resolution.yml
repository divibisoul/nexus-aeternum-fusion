name: Final dependency resolution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize package lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Apply compatible audit fixes
        run: npm audit fix --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify security gate
        run: npm audit --audit-level=high
      - name: Persist repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(n03): persist audited dependency lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF}
