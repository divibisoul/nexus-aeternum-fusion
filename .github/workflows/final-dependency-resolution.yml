name: Final dependency resolution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize package lockfile in workspace
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Apply compatible audit fixes in workspace
        run: npm audit fix --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile is unchanged by dependency automation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package-lock.json; then
            echo 'LOCKFILE_DRIFT_AFTER_DEPENDENCY_AUTOMATION'
            git --no-pager diff -- package-lock.json
            exit 1
          fi
      - name: Verify security gate
        run: npm audit --audit-level=high
      - name: Generate dependency failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > dependency-audit.json
      - name: Upload dependency failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n03-final-dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 30
