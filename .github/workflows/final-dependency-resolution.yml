name: Final dependency resolution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize package lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Apply compatible audit fixes
        run: npm audit fix --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Persist dependency repair
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix: synchronize npm dependency security updates'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Verify security gate
        run: npm audit --audit-level=high
