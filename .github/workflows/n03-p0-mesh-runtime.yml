name: N03 P0 Mesh Runtime Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Registry contract test
        run: bun test src/mesh/N03AudioCapabilityRegistry.test.ts

      - name: Mesh listener smoke
        run: npm run mesh:listener:check
