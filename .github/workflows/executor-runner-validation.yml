name: N03 Executor Runner Validation

on:
  push:
    branches: [fix/n03-lockfile-sync-2026-09-01]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: N03 runner + npm ci + audit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          node --version
          npm --version
          test -n "${RUNNER_NAME:-}" || { echo "ERROR: GitHub runner was not provisioned."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate diagnostics
        run: node scripts/diagnostics.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n03-diagnostics
          path: .diagnostics/
          if-no-files-found: error
      - name: Install exact locked dependencies
        run: npm ci
      - name: Audit high severity
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
