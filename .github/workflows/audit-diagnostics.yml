name: Audit diagnostics
on:
  push:
    branches: [audit/2026-09-01-hardening]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== node/npm ==='; node --version; npm --version
            echo '=== package.json ==='; cat package.json
            echo '=== npm install lockfile ==='; npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
            echo "lockfile_exit=$?"
            echo '=== npm install full ==='; npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
            echo "install_exit=$?"
            echo '=== npm audit ==='; npm audit --audit-level=high
            echo "audit_exit=$?"
          } 2>&1 | tee audit-diagnostics-n03.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-diagnostics-n03.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(audit): capture N03 dependency diagnostics [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
